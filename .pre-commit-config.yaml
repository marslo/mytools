# yamllint disable rule:indentation
---

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^\.marslo/gitconfig\.d/.*$
      - id: end-of-file-fixer
        name: End Of File Fixer
        exclude: ^\.marslo/gitconfig\.d/.*$
      - id: check-yaml
        name: Check YAML
        args: ["--unsafe"]
      - id: check-json
        name: Check JSON
        exclude: (?x)^(
            .*rc.*\.json|
            .*config.*\.json|
            .*[Ss]ettings.*\.json|
            .*keybindings\.json|
            .*\.code-workspace|
            \.vscode/.*\.json
          )$
      - id: check-merge-conflict
        name: Check Merge Conflict
      - id: check-case-conflict
        name: Check Case Conflict
        exclude: ^\.marslo/gitconfig\.d/.*$
      - id: mixed-line-ending
        name: Mixed Line Ending
        args: ["--fix=lf"]
        exclude: ^(\.marslo/gitconfig\.d/.*|.*/vimrc.d/shortcuts)$

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        name: Check JSONC
        files: (?x)(
            .*rc.*\.json|
            .*config.*\.json|
            .*[Ss]ettings.*\.json|
            .*keybindings\.json|
            .*\.code-workspace|
            \.vscode/.*\.json
          )$

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
        name: Forbid CRLF Line Endings
      - id: remove-tabs
        name: Remove Tabs (2 spaces)
        args: [--whitespaces-count, '2']
        files: '\.(bash|sh|groovy|yaml|yml|js|json|ini|cfg|txt|md)$'
      - id: remove-tabs
        name: Remove Tabs (4 spaces)
        args: [--whitespaces-count, '4']
        files: '\.py$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        name: Typos
        args: ['--write-changes', '--force-exclude']
      # scan the commit message itself; no --write-changes -> only fail, never rewrite the message
      - id: typos
        name: Typos (commit message)
        alias: typos-commit-msg
        stages: [commit-msg]
        args: ['--force-exclude']

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck (bundled)
        language: python
        additional_dependencies: [shellcheck-py]
        entry: shellcheck
        types: [shell]
        args: ["--severity=warning"]
        files: '\.sh$'
