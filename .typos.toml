[files]
ignore-hidden = true
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-global = true
ignore-parent = true
extend-exclude = []

[default]
binary = false
check-filename = true
check-file = true
unicode=true
locale = "en"
extend-ignore-re = []

# case sensitive
[default.extend-identifiers]
fRcLaf = 'fRcLaf'
ZFiwCf = 'ZFiwCf'
izN7If = 'izN7If'

# case insensitive
[default.extend-words]
# <typo> = "<correction>"
debuger = 'debuger'
infomation = 'infomation'
kno = 'kno'
transparant = 'transparant'
apperance = 'apperance'
Ue = 'Ue'
Ba = 'Ba'
Gae = 'Gae'
Pn = 'Pn'
seperator = 'seperator'
pannel = 'pannel'
# brewfile
lookin = 'lookin'
# groovy-libs.sh
testng = 'testng'
bui = 'bui'
